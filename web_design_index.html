<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRAVEL BANNER</title>
  <style>
    root{
    --dark: #10151c;
    --accent: #3d6fa8;
    --accent-light: #6fa3d8;
    --text-light: #f4f6f8;
    --text-muted: #c7cfd8;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  body{
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background:#dfe7ef;
  }

  .hero{
    position:relative;
    min-height:100vh;
    width:100%;
    background:
      linear-gradient(to bottom, rgba(10,15,20,0.55), rgba(10,15,20,0.25) 40%, rgba(10,15,20,0.55)),
      url('https://images.unsplash.com/photo-1533130061792-64b345e4a833?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
    display:flex;
    flex-direction:column;
    color:var(--text-light);
    padding:2rem clamp(1.25rem, 5vw, 5rem);
  }

  /* ---------- NAV ---------- */
  .navbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:1rem;
    padding-bottom:2.5rem;
  }

  .logo{
    display:flex;
    align-items:center;
    gap:.6rem;
    font-weight:700;
    letter-spacing:.5px;
    font-size:1rem;
  }

  .logo-dot{
    width:26px;
    height:26px;
    border-radius:50%;
    background: conic-gradient(#e63946, #f4a825, #2a9d8f, #3d6fa8, #e63946);
    flex-shrink:0;
  }

  .nav-links{
    display:flex;
    gap:2.2rem;
    list-style:none;
    font-size:.95rem;
  }

  .nav-links a{
    color:var(--text-light);
    text-decoration:none;
    padding-bottom:.35rem;
    opacity:.9;
  }

  .nav-links a.active{
    border-bottom:2px solid var(--text-light);
    opacity:1;
  }

  .nav-icons{
    display:flex;
    align-items:center;
    gap:1rem;
    background:rgba(255,255,255,0.12);
    padding:.5rem 1rem;
    border-radius:30px;
  }

  .nav-icons button{
    background:none;
    border:none;
    color:var(--text-light);
    font-size:1rem;
    cursor:pointer;
  }

  /* ---------- MAIN CONTENT ---------- */
  .content{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:2.5rem;
  }

  .copy{
    max-width:520px;
    flex:1 1 340px;
  }

  .eyebrow{
    font-size:clamp(1.1rem, 2vw, 1.4rem);
    letter-spacing:6px;
    color:var(--text-muted);
    margin-bottom:.4rem;
    font-weight:300;
  }

  .headline{
    font-size:clamp(2.2rem, 5vw, 3.4rem);
    font-weight:800;
    line-height:1.08;
    margin-bottom:1.3rem;
    text-transform:uppercase;
  }

  .description{
    color:var(--text-muted);
    font-size:.95rem;
    line-height:1.7;
    max-width:420px;
    margin-bottom:2.2rem;
  }

  .cta{
    display:inline-block;
    background:var(--accent);
    color:#fff;
    border:none;
    padding:.85rem 2.2rem;
    border-radius:30px;
    font-size:.95rem;
    font-weight:600;
    cursor:pointer;
    margin-bottom:2.2rem;
    transition:background .25s ease;
  }

  .cta:hover{ background:var(--accent-light); }

  .site-url{
    font-size:.95rem;
    color:var(--text-light);
    letter-spacing:.5px;
  }

  /* ---------- IMAGE GALLERY ---------- */
  .gallery{
    display:flex;
    gap:.9rem;
    flex:1 1 420px;
    justify-content:flex-end;
    align-items:stretch;
  }

  .gallery img{
    width:150px;
    height:340px;
    object-fit:cover;
    border-radius:8px;
    box-shadow:0 10px 25px rgba(0,0,0,.35);
    flex-shrink:1;
  }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 992px){
    .gallery{ justify-content:center; }
    .gallery img{ width:23%; height:280px; }
    .content{ justify-content:center; text-align:center; }
    .copy{ margin:0 auto; }
    .description{ margin-left:auto; margin-right:auto; }
  }

  @media (max-width: 768px){
    .nav-links{ order:3; width:100%; justify-content:center; gap:1.4rem; font-size:.85rem; }
    .navbar{ justify-content:center; text-align:center; }
    .gallery img{ height:220px; }
  }

  @media (max-width: 560px){
    .hero{ padding:1.5rem 1.25rem; }
    .gallery{ flex-wrap:wrap; }
    .gallery img{ width:47%; height:200px; }
    .eyebrow{ letter-spacing:3px; }
  }

  @media (max-width: 380px){
    .gallery img:nth-child(3),
    .gallery img:nth-child(4){ display:none; } /* keep it clean on very small screens */
  }

  </style>
</head>
<body>
  <section class="hero">

  <nav class="navbar">
    <div class="logo">
      <span class="logo-dot"></span>
      GRAPHICSFAMILY
    </div>
    <ul class="nav-links">
      <li><a href="#" class="active">About</a></li>
      <li><a href="#">Designer</a></li>
      <li><a href="#">Features</a></li>
      <li><a href="#">News</a></li>
    </ul>
    <div class="nav-icons">
      <button aria-label="search">&#128269;</button>
      <button aria-label="menu">&#9776;</button>
    </div>
  </nav>

  <div class="content">
    <div class="copy">
      <p class="eyebrow">TIME TO</p>
      <h1 class="headline">Explore the World</h1>
      <p class="description">
        Lorem ipsum dolor sit amet, consectetur adipiscing elit,
        sed do eiusmod tempor incididunt ut labore et dolore magna
        aliqua. Quis ipsum.
      </p>
      <button class="cta">Learn More</button>
      <p class="site-url">www.graphicsfamily.com</p>
    </div>

    <div class="gallery">
      <img src="https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&fit=crop&w=400&q=80" alt="Hiker holding hand">
      <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=400&q=80" alt="Woman jumping by frozen lake">
      <img src="https://images.unsplash.com/photo-1533130061792-64b345e4a833?auto=format&fit=crop&w=400&q=80" alt="ATV riding on dunes">
      <img src="https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=400&q=80" alt="Ocean cliffs">
    </div>
  </div>

</section>

</body>
</html>
