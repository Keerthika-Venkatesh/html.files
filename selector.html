<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> combinator selector</title>
    <style>
        /*direct child (>)*/
        div > p {
            color:blue;
        }
        /*Next sibling combinator(+)*/
        h2 + p{
            color: darkgreen;
        }
        /*Subsequent sibling combinator(~)*/
        div h2 ~ p{
            color: orange;
        }
    </style>
</head>
<body>
   <div>
      <p>Decendant combinator</p>
       <section>
        <p>Inside section(grandchild)</p>
       </section>
    </div> 
    <p>Matches all the elements that are decendent of a specified element</p>

</body>
</html>
